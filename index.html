<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Solar System & Spacetime Curvature Laboratory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root {
    --bg-dark: #04070e;
    --panel-bg: rgba(11, 16, 29, 0.94);
    --panel-border: #1e2d4a;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #00d2ff;
    --accent-sec: #a855f7;
    --gr-col: #f43f5e;
    --newt-col: #10b981;
    --warn: #f59e0b;
    --card-bg: #070b14;
    --input-bg: #060a12;
    --header-bg: #080c17;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* Bright Day / Classroom Mode Theme Variables */
  body.day-mode {
    --bg-dark: #eef4fb;
    --panel-bg: rgba(255, 255, 255, 0.95);
    --panel-border: #cbd5e1;
    --text-main: #0f172a;
    --text-muted: #475569;
    --accent: #0284c7;
    --accent-sec: #7c3aed;
    --gr-col: #e11d48;
    --newt-col: #059669;
    --warn: #d97706;
    --card-bg: #f8fafc;
    --input-bg: #ffffff;
    --header-bg: #f1f5f9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font-sans);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: background 0.25s, color 0.25s;
  }

  /* Header & 10-Module Navigation */
  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--panel-border);
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 35;
    flex-shrink: 0;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  .brand span.sub {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 11.5px;
  }
  .module-bar {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .module-bar::-webkit-scrollbar { height: 4px; }
  .module-bar::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }
  .mod-btn {
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .mod-btn:hover { color: var(--text-main); border-color: var(--accent); }
  .mod-btn.active {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }

  .btn-sm {
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 4px 9px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.active-toggle {
    background: rgba(0, 210, 255, 0.2);
    border-color: var(--accent);
    color: var(--accent);
  }
  .btn-sm.theme-btn {
    background: linear-gradient(135deg, #f59e0b, #0284c7);
    color: #fff;
    border: none;
  }

  /* Main Full-Screen Workspace */
  .app-body {
    flex: 1;
    position: relative;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #canvas-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* Left, Right & Bottom Slide-Out Drawers */
  .left-drawer {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 345px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 20;
    box-shadow: 8px 0 28px rgba(0,0,0,0.35);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .left-drawer.closed { transform: translateX(-100%); }

  .right-drawer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 355px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border-left: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 20;
    box-shadow: -8px 0 28px rgba(0,0,0,0.35);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .right-drawer.closed { transform: translateX(100%); }

  .bottom-drawer {
    position: absolute;
    left: 345px;
    right: 355px;
    bottom: 0;
    height: 195px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--panel-border);
    z-index: 18;
    display: flex;
    flex-direction: column;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), left 0.28s, right 0.28s;
  }
  .bottom-drawer.closed { transform: translateY(100%); }
  .bottom-drawer.expand-left { left: 0; }
  .bottom-drawer.expand-right { right: 0; }

  .left-drawer::-webkit-scrollbar,
  .right-drawer::-webkit-scrollbar { width: 5px; }
  .left-drawer::-webkit-scrollbar-thumb,
  .right-drawer::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

  /* Drawer Handle Tabs */
  .drawer-tab-left {
    position: absolute;
    top: 45%;
    left: 345px;
    transform: translateY(-50%);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-left: none;
    color: var(--accent);
    padding: 12px 6px;
    border-radius: 0 8px 8px 0;
    cursor: pointer;
    z-index: 25;
    writing-mode: vertical-rl;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    transition: left 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none;
  }
  .drawer-tab-left.closed { left: 0; }

  .drawer-tab-right {
    position: absolute;
    top: 45%;
    right: 355px;
    transform: translateY(-50%);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-right: none;
    color: var(--accent);
    padding: 12px 6px;
    border-radius: 8px 0 0 8px;
    cursor: pointer;
    z-index: 25;
    writing-mode: vertical-rl;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    transition: right 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none;
  }
  .drawer-tab-right.closed { right: 0; }

  .drawer-tab-bottom {
    position: absolute;
    bottom: 195px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-bottom: none;
    color: var(--accent);
    padding: 4px 16px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    z-index: 25;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    transition: bottom 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    user-select: none;
  }
  .drawer-tab-bottom.closed { bottom: 0; }

  .panel-sec {
    padding: 11px 14px;
    border-bottom: 1px solid var(--panel-border);
  }
  .sec-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Sliders & Controls */
  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 8px;
  }
  .slider-head {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    align-items: center;
  }
  .slider-head span.val {
    font-family: var(--font-mono);
    color: var(--accent);
    font-weight: 600;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 5px;
    cursor: pointer;
  }
  select, input[type="number"] {
    background: var(--input-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 5px 8px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    width: 100%;
    outline: none;
  }
  .chk-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 4px;
  }
  .chk-lbl {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    cursor: pointer;
    color: var(--text-main);
  }

  /* Celestial Object Grid & Info Cards */
  .planet-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 8px;
  }
  .planet-btn {
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 6px 6px;
    border-radius: 5px;
    font-size: 11px;
    text-align: center;
    cursor: pointer;
    transition: 0.12s;
  }
  .planet-btn:hover, .planet-btn.selected {
    border-color: var(--accent);
    background: rgba(0, 210, 255, 0.18);
    color: var(--accent);
    font-weight: 700;
  }
  .info-card {
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 11.5px;
    line-height: 1.48;
    margin-bottom: 8px;
  }
  .info-card h4 {
    color: var(--accent);
    font-size: 12.5px;
    margin-bottom: 4px;
  }
  .formula-box {
    background: rgba(0, 210, 255, 0.08);
    border-left: 3px solid var(--accent);
    padding: 6px 9px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-main);
    margin: 5px 0;
    border-radius: 0 4px 4px 0;
  }
  .warn-banner {
    background: rgba(245, 158, 11, 0.14);
    border: 1px solid var(--warn);
    color: var(--warn);
    padding: 6px 9px;
    border-radius: 5px;
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 11px;
    margin-top: 4px;
  }
  .data-table td {
    padding: 3px 5px;
    border-bottom: 1px solid var(--panel-border);
  }
  .data-table td.val {
    text-align: right;
    color: var(--accent);
    font-weight: 600;
  }

  /* Top Floating Camera & Scale Banner */
  .top-floating-bar {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    background: var(--panel-bg);
    backdrop-filter: blur(8px);
    padding: 5px 10px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    z-index: 15;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .scale-alert-pill {
    position: absolute;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid var(--warn);
    color: var(--warn);
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-family: var(--font-mono);
    z-index: 14;
    pointer-events: none;
  }

  /* Bottom Panel Content */
  .bottom-content {
    flex: 1;
    display: grid;
    grid-template-columns: 270px 1fr 270px;
    gap: 10px;
    padding: 8px 12px;
    overflow: hidden;
  }
  .telemetry-box {
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 7px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .tel-row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px dashed var(--panel-border);
    padding: 2px 0;
  }
  .tel-row span.v { color: var(--accent); font-weight: 600; }
  #live-graph-canvas {
    width: 100%;
    height: 100%;
    background: var(--card-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <span>3D SOLAR SYSTEM &amp; SPACETIME CURVATURE LAB</span>
      <span class="sub">Realistic Planet Textures, Individual Zoom &amp; Day/Dark Modes</span>
    </div>
    <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap;">
      <button class="btn-sm theme-btn" id="btn-theme-mode" onclick="toggleDayNightMode()">☀️ Switch to Day Mode</button>
      <button class="btn-sm" id="btn-unit-sys" onclick="toggleUnitSystem()">Units: SI (m, kg, s)</button>
      <button class="btn-sm active-toggle" id="btn-left-drawer" onclick="toggleLeftDrawer()">◧ Objects &amp; Zoom</button>
      <button class="btn-sm active-toggle" id="btn-right-drawer" onclick="toggleRightDrawer()">◨ Physics &amp; Math</button>
      <button class="btn-sm active-toggle" id="btn-bottom-drawer" onclick="toggleBottomDrawer()">◫ Graphs &amp; Time</button>
      <button class="btn-sm" id="btn-clean-view" onclick="toggleCleanSpaceView()">👁 Clean 3D Space</button>
    </div>
  </div>

  <!-- 10 Core Modules Navigation Bar -->
  <div class="module-bar">
    <button class="mod-btn active" id="mod-solar" onclick="selectModule('solar')">1. Solar System Explorer</button>
    <button class="mod-btn" id="mod-newton" onclick="selectModule('newton')">2. Newtonian Gravity &amp; Field Lab</button>
    <button class="mod-btn" id="mod-orbital" onclick="selectModule('orbital')">3. Orbital Mechanics &amp; Kepler Lab</button>
    <button class="mod-btn" id="mod-spacetime" onclick="selectModule('spacetime')">4. Spacetime Curvature Explorer</button>
    <button class="mod-btn" id="mod-gr" onclick="selectModule('gr')">5. General Relativity &amp; Geodesics</button>
    <button class="mod-btn" id="mod-blackhole" onclick="selectModule('blackhole')">6. Black Hole Laboratory</button>
    <button class="mod-btn" id="mod-lensing" onclick="selectModule('lensing')">7. Gravitational Lensing Lab</button>
    <button class="mod-btn" id="mod-timedilation" onclick="selectModule('timedilation')">8. Gravitational Time Dilation</button>
    <button class="mod-btn" id="mod-compare" onclick="selectModule('compare')">9. Newtonian vs General Relativity</button>
    <button class="mod-btn" id="mod-experiments" onclick="selectModule('experiments')">10. N-Body Sandbox, Course &amp; Quiz</button>
  </div>
</header>

<div class="app-body">
  <!-- LEFT DRAWER: OBJECT SELECTION, INDIVIDUAL PLANET ZOOM & LAYERS -->
  <aside class="left-drawer" id="left-drawer">
    <div id="dynamic-left-panel"></div>

    <!-- Universal Visualization Layers & Scale Controls -->
    <div class="panel-sec" style="border-bottom:none;">
      <div class="sec-title"><span>Visualization Layers &amp; Scaling</span></div>
      <div class="chk-grid">
        <label class="chk-lbl"><input type="checkbox" id="chk-orbits" checked onchange="syncLayers()"> Orbital Paths</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-vel-vec" checked onchange="syncLayers()"> Velocity Vec (v)</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-acc-vec" checked onchange="syncLayers()"> Gravity Vec (g)</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-labels" checked onchange="syncLayers()"> 3D Body Labels</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-asteroids" checked onchange="syncLayers()"> Asteroid Belt</label>
        <label class="chk-lbl"><input type="checkbox" id="chk-dwarfs" checked onchange="syncLayers()"> Pluto &amp; Comets</label>
      </div>
    </div>
  </aside>

  <div class="drawer-tab-left" id="tab-left" onclick="toggleLeftDrawer()">◀ OBJECTS</div>

  <!-- CENTER 3D SPACE VIEWPORT -->
  <main id="canvas-container"></main>

  <!-- TOP FLOATING CAMERA & INDIVIDUAL ZOOM BAR -->
  <div class="top-floating-bar">
    <button class="btn-sm active-toggle" id="btn-play" onclick="togglePlay()">⏸ Pause</button>
    <button class="btn-sm" onclick="stepSimulation(-1)">◀ −Δt</button>
    <button class="btn-sm" onclick="stepSimulation(1)">+Δt ▶</button>
    <span style="color:#64748b;">|</span>
    <button class="btn-sm active-toggle" id="btn-zoom-planet" onclick="zoomToSelectedPlanet()" style="border-color:var(--newt-col); color:var(--newt-col);">🔍 Zoom &amp; Lock Selected Planet</button>
    <button class="btn-sm" onclick="setCameraPreset('overview')">Solar Overview</button>
    <button class="btn-sm" onclick="setCameraPreset('ecliptic_top')">Top View</button>
    <button class="btn-sm" onclick="setCameraPreset('edge_on')">Edge-On</button>
    <button class="btn-sm" onclick="exportGraphCSV()">⬇ CSV</button>
  </div>

  <!-- SCALE DISCLOSURE BANNER -->
  <div class="scale-alert-pill" id="scale-alert-pill">
    🔍 Click any planet on the left (or in 3D) to Zoom In close-up! Click "Solar Overview" to zoom back out.
  </div>

  <div class="drawer-tab-right" id="tab-right" onclick="toggleRightDrawer()">PHYSICS &amp; MATH ▶</div>

  <!-- RIGHT DRAWER: PARAMETERS, EQUATIONS, MODEL ASSUMPTIONS & TELEMETRY -->
  <aside class="right-drawer" id="right-drawer">
    <div id="dynamic-right-panel"></div>
  </aside>

  <div class="drawer-tab-bottom" id="tab-bottom" onclick="toggleBottomDrawer()">▼ TIMELINE &amp; LIVE GRAPHS</div>

  <!-- BOTTOM DRAWER: TIMELINE, GRAPH & MODEL VALIDATION -->
  <section class="bottom-drawer" id="bottom-drawer">
    <div class="bottom-content">
      <div class="telemetry-box" id="bottom-left-telemetry"></div>
      <canvas id="live-graph-canvas"></canvas>
      <div class="telemetry-box" id="bottom-right-model-info"></div>
    </div>
  </section>
</div>

<script>
/* ============================================================================
   1. ASTRONOMICAL CONSTANTS & WELL-SPACED CELESTIAL DATASET
   We provide well-spaced visual orbital radii (sceneRadius) so inner planets
   (Mercury, Venus, Earth, Mars) never crowd into the glowing Sun!
   ============================================================================ */
const CONST = {
  G: 6.67430e-11,
  c: 299792458,
  AU: 1.495978707e11,
  M_sun: 1.98847e30,
  M_earth: 5.9722e24
};

const SOLAR_BODIES = [
  { id: 'sun', name: 'Sun', type: 'G2V Main-Sequence Star', massKg: 1.9885e30, radiusKm: 696340, a_AU: 0, sceneDist: 0, baseRadius: 3.4, e: 0, incDeg: 0, periodDays: 25, v_kms: 0, gm: '1.327×10²⁰', color: 0xffaa00, desc: 'Glowing plasma sphere driven by nuclear fusion in its core; contains 99.86% of Solar System mass.' },
  { id: 'mercury', name: 'Mercury', type: 'Terrestrial Planet', massKg: 3.3011e23, radiusKm: 2439.7, a_AU: 0.3871, sceneDist: 8.5, baseRadius: 0.45, e: 0.2056, incDeg: 7.0, periodDays: 87.97, v_kms: 47.36, gm: '2.203×10¹³', color: 0x94a3b8, desc: 'Cratered innermost planet with high eccentricity (e = 0.2056) and 43″/century GR perihelion precession.' },
  { id: 'venus', name: 'Venus', type: 'Terrestrial Planet', massKg: 4.8675e24, radiusKm: 6051.8, a_AU: 0.7233, sceneDist: 13.0, baseRadius: 0.72, e: 0.0068, incDeg: 3.39, periodDays: 224.70, v_kms: 35.02, gm: '3.249×10¹⁴', color: 0xfde047, desc: 'Shrouded in thick golden-amber sulfuric acid clouds with a runaway greenhouse atmosphere.' },
  { id: 'earth', name: 'Earth', type: 'Terrestrial Planet', massKg: 5.9722e24, radiusKm: 6371.0, a_AU: 1.0000, sceneDist: 18.5, baseRadius: 0.78, e: 0.0167, incDeg: 0.0, periodDays: 365.256, v_kms: 29.78, gm: '3.986×10¹⁴', color: 0x38bdf8, desc: 'Blue ocean world with continents, polar ice caps, atmospheric glow, and our Moon.' },

/* ============================================================================
   2. PROCEDURAL PLANET & FIRE SUN TEXTURE GENERATOR (REALISTIC 3D LOOK)
   ============================================================================ */
function generatePlanetTexture(id) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  if (id === 'sun') {
    // Fiery solar plasma granulation
    const grad = ctx.createLinearGradient(0, 0, 512, 256);
    grad.addColorStop(0, '#ff4500');
    grad.addColorStop(0.5, '#ff9900');
    grad.addColorStop(1, '#ff5500');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 900; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 256;
      const r = 2 + Math.random() * 14;
      ctx.fillStyle = Math.random() > 0.35 ? 'rgba(255, 240, 130, 0.35)' : 'rgba(180, 30, 0, 0.3)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  } else if (id === 'earth') {
    // Deep blue oceans + green/brown continents + white polar ice caps + clouds
    ctx.fillStyle = '#0c4a6e';
    ctx.fillRect(0, 0, 512, 256);
    ctx.fillStyle = '#15803d';
    for (let i = 0; i < 45; i++) {
      const cx = Math.random() * 512, cy = 35 + Math.random() * 186;
      const rx = 15 + Math.random() * 45, ry = 10 + Math.random() * 30;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, Math.random() * 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#a16207';
    for (let i = 0; i < 20; i++) {
      ctx.beginPath(); ctx.arc(Math.random() * 512, 50 + Math.random() * 150, 12 + Math.random() * 18, 0, Math.PI * 2); ctx.fill();
    }
    // Polar ice caps
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, 512, 18);
    ctx.fillRect(0, 238, 512, 18);
    // Wispy clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
    for (let i = 0; i < 60; i++) {
      ctx.fillRect(Math.random() * 512, Math.random() * 256, 30 + Math.random() * 60, 4 + Math.random() * 6);
    }
  } else if (id === 'jupiter') {
    // Zonal atmospheric bands + Great Red Spot
    const bands = ['#d97706', '#fef3c7', '#b45309', '#fde68a', '#92400e', '#fed7aa', '#c2410c', '#fef3c7', '#b45309'];
    const bh = 256 / bands.length;
    bands.forEach((col, idx) => {
      ctx.fillStyle = col;
      ctx.fillRect(0, idx * bh, 512, bh + 2);
    });
    // Great Red Spot
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.ellipse(320, 165, 34, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 3; ctx.stroke();
  } else if (id === 'saturn') {
    const bands = ['#fde68a', '#eab308', '#fef08a', '#ca8a04', '#fde047', '#a16207', '#fef08a'];
    const bh = 256 / bands.length;
    bands.forEach((col, idx) => {
      ctx.fillStyle = col;
      ctx.fillRect(0, idx * bh, 512, bh + 2);
    });
  } else if (id === 'mars') {
    ctx.fillStyle = '#c2410c';
    ctx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 120; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(124, 45, 18, 0.45)' : 'rgba(251, 146, 60, 0.35)';
      ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 256, 4 + Math.random() * 20, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, 512, 12);
    ctx.fillRect(0, 244, 512, 12);
  } else if (id === 'venus') {
    ctx.fillStyle = '#eab308';
    ctx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 80; i++) {
      ctx.fillStyle = 'rgba(254, 240, 138, 0.3)';
      ctx.fillRect(0, Math.random() * 256, 512, 6 + Math.random() * 12);
    }
  } else if (id === 'uranus' || id === 'neptune') {
    ctx.fillStyle = id === 'uranus' ? '#22d3ee' : '#2563eb';
    ctx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 50; i++) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.fillRect(0, Math.random() * 256, 512, 4 + Math.random() * 10);
    }
  } else {
    // Cratered rocky surface for Mercury, Moon, Pluto
    ctx.fillStyle = id === 'pluto' ? '#a8a29e' : '#64748b';
    ctx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 180; i++) {
      const x = Math.random() * 512, y = Math.random() * 256, r = 2 + Math.random() * 12;
      ctx.fillStyle = 'rgba(30, 41, 59, 0.5)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  return tex;
}

// Create Glowing Fire Corona Sprite for the Sun
function createSunGlowSprite() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(128, 128, 18, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255, 255, 220, 1.0)');
  grad.addColorStop(0.25, 'rgba(255, 165, 0, 0.85)');
  grad.addColorStop(0.55, 'rgba(255, 60, 0, 0.35)');
  grad.addColorStop(1, 'rgba(255, 0, 0, 0.0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(16, 16, 1);
  return sprite;
}

/* ============================================================================
   5. MODULE 1: REALISTIC SOLAR SYSTEM WITH SPACED ORBITS & INDIVIDUAL ZOOM
   ============================================================================ */
function getSceneOrbitDistance(body) {
  if (body.id === 'sun') return 0;
  if (state.scaleViewMode === 'scale_aware') {
    return (4.5 + body.a_AU * 12.0) * state.orbitSpacingFactor;
  }
  return body.sceneDist * state.orbitSpacingFactor;
}

function getScenePlanetRadius(body) {
  if (body.id === 'sun') return 3.5;
  return body.baseRadius * state.planetSizeExag;
}

function solveKeplerPosition(body, tDays) {
  if (body.id === 'sun') return { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, r_AU: 0, speed_kms: 0 };

  if (body.parent === 'earth') {
    const earthBody = SOLAR_BODIES.find(b => b.id === 'earth');
    const earthPos = solveKeplerPosition(earthBody, tDays);
    const angle = (2 * Math.PI * tDays) / body.periodDays;
    const moonDist = getScenePlanetRadius(earthBody) + 1.45;
    return {
      x: earthPos.x + moonDist * Math.cos(angle),
      y: earthPos.y + moonDist * Math.sin(angle) * Math.sin((body.incDeg * Math.PI) / 180),
      z: earthPos.z + moonDist * Math.sin(angle),
      vx: -Math.sin(angle), vy: 0, vz: Math.cos(angle),
      r_AU: body.a_AU, speed_kms: body.v_kms
    };
  }

  const M = ((2 * Math.PI * tDays) / body.periodDays) % (2 * Math.PI);
  let E = M;
  for (let i = 0; i < 6; i++) {
    E = E - (E - body.e * Math.sin(E) - M) / (1 - body.e * Math.cos(E));
  }
  const cosE = Math.cos(E), sinE = Math.sin(E);
  const r_AU = body.a_AU * (1 - body.e * cosE);
  const trueAnomaly = Math.atan2(Math.sqrt(1 - body.e * body.e) * sinE, cosE - body.e);

  const aScene = getSceneOrbitDistance(body);
  const rScene = aScene * (1 - body.e * cosE);
  const incRad = (body.incDeg * Math.PI) / 180;

  const x = rScene * Math.cos(trueAnomaly);
  const z = rScene * Math.sin(trueAnomaly) * Math.cos(incRad);
  const y = rScene * Math.sin(trueAnomaly) * Math.sin(incRad);

  const v_kms = 29.78 * Math.sqrt(Math.max(0.01, 2 / r_AU - 1 / body.a_AU));
  const vx = -Math.sin(trueAnomaly);
  const vz = Math.cos(trueAnomaly) * Math.cos(incRad);
  const vy = Math.cos(trueAnomaly) * Math.sin(incRad);

  return { x, y, z, vx, vy, vz, r_AU, speed_kms: v_kms };
}

function initSolarSystem3D() {
  clearGroup(solarGroup);
  planetMeshMap = {};
  clickableObjects = [];

  SOLAR_BODIES.forEach(body => {
    const rad = getScenePlanetRadius(body);
    const tex = generatePlanetTexture(body.id);

    let mat;
    if (body.id === 'sun') {
      mat = new THREE.MeshBasicMaterial({ map: tex });
    } else {
      mat = new THREE.MeshPhongMaterial({
        map: tex,
        shininess: body.id === 'earth' ? 25 : 8,
        specular: body.id === 'earth' ? 0x334155 : 0x111111
      });
    }

    const mesh = new THREE.Mesh(new THREE.SphereGeometry(rad, 36, 28), mat);
    mesh.userData = { bodyId: body.id };
    solarGroup.add(mesh);
    clickableObjects.push(mesh);

    // Add Fiery Multi-Layer Corona Glow to the Sun
    if (body.id === 'sun') {
      const coronaSprite = createSunGlowSprite();
      mesh.add(coronaSprite);
      const innerHalo = new THREE.Mesh(
        new THREE.SphereGeometry(rad * 1.12, 32, 24),
        new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.35, side: THREE.BackSide })
      );
      mesh.add(innerHalo);
    }

    // Add Atmospheric Halo to Earth
    if (body.id === 'earth') {
      const atmo = new THREE.Mesh(
        new THREE.SphereGeometry(rad * 1.08, 28, 24),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.22, side: THREE.BackSide })
      );
      mesh.add(atmo);
    }

    // Add Multi-Band Rings to Saturn & Uranus
    if (body.hasRings) {
      const innerR = rad * 1.35;
      const outerR = body.id === 'saturn' ? rad * 2.35 : rad * 1.75;
      const ringGeo = new THREE.RingGeometry(innerR, outerR, 64);
      ringGeo.rotateX(body.id === 'uranus' ? Math.PI / 12 : Math.PI / 2.2);
      const ringMat = new THREE.MeshBasicMaterial({
        color: body.id === 'saturn' ? 0xfde68a : 0x67e8f9,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: body.id === 'saturn' ? 0.75 : 0.35
      });
      mesh.add(new THREE.Mesh(ringGeo, ringMat));
    }

    const lblCol = state.dayMode ? '#0f172a' : '#' + body.color.toString(16).padStart(6, '0');
    const lbl = makeTextSprite(body.name, lblCol, 0.85);
    solarGroup.add(lbl);

    // Well-spaced Keplerian Orbit Curve
    let orbitLine = null;
    if (body.a_AU > 0 && !body.parent) {
      const pts = [];
      const steps = 140;
      for (let i = 0; i <= steps; i++) {
        const p = solveKeplerPosition(body, (body.periodDays * i) / steps);
        pts.push(new THREE.Vector3(p.x, p.y, p.z));
      }
      orbitLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({
          color: state.dayMode ? 0x475569 : body.color,
          transparent: true,
          opacity: body.isDwarf ? 0.35 : (state.dayMode ? 0.65 : 0.5)
        })
      );
      solarGroup.add(orbitLine);
    }

    const vArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), rad + 1.8, 0x10b981, 0.4, 0.22);
    const aArrow = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(), rad + 1.5, 0xf43f5e, 0.4, 0.22);
    solarGroup.add(vArrow, aArrow);

    planetMeshMap[body.id] = { body, mesh, lbl, orbitLine, vArrow, aArrow, prevTargetPos: new THREE.Vector3() };
  });

  // Well-spaced Asteroid Belt between Mars (24.5) and Jupiter (36.0)
  const astVerts = [];
  for (let i = 0; i < 1000; i++) {
    const r = (28.5 + Math.random() * 4.5) * state.orbitSpacingFactor;
    const ang = Math.random() * 2 * Math.PI;
    const y = (Math.random() - 0.5) * 0.9;
    astVerts.push(r * Math.cos(ang), y, r * Math.sin(ang));
  }
  const astGeo = new THREE.BufferGeometry();
  astGeo.setAttribute('position', new THREE.Float32BufferAttribute(astVerts, 3));
  const astCloud = new THREE.Points(astGeo, new THREE.PointsMaterial({ color: state.dayMode ? 0x475569 : 0x94a3b8, size: 0.22 }));
  astCloud.name = 'asteroidBelt';
  solarGroup.add(astCloud);
}

function updateSolarSystemFrame(dt) {
  if (state.running) {
    state.simTimeDays += state.simDaysPerSec * dt;
  }

  const showOrbits = document.getElementById('chk-orbits').checked;
  const showVel = document.getElementById('chk-vel-vec').checked;
  const showAcc = document.getElementById('chk-acc-vec').checked;
  const showLabels = document.getElementById('chk-labels').checked;
  const showDwarfs = document.getElementById('chk-dwarfs').checked;
  const showAst = document.getElementById('chk-asteroids').checked;

  const astObj = solarGroup.getObjectByName('asteroidBelt');
  if (astObj) astObj.visible = showAst;

  SOLAR_BODIES.forEach(body => {
    const item = planetMeshMap[body.id];
    if (!item) return;

    const visibleBody = !body.isDwarf || showDwarfs;
    item.mesh.visible = visibleBody;
    item.lbl.visible = visibleBody && showLabels;
    if (item.orbitLine) item.orbitLine.visible = visibleBody && showOrbits;

    // Axial rotation of the Sun and planets
    item.mesh.rotation.y += (body.id === 'sun' ? 0.4 : 1.2) * dt;

    const pos = solveKeplerPosition(body, state.simTimeDays);
    const oldPos = item.mesh.position.clone();
    item.mesh.position.set(pos.x, pos.y, pos.z);
    item.lbl.position.set(pos.x, pos.y + getScenePlanetRadius(body) + 1.0, pos.z);
    item.currentState = pos;

    // If camera is locked & zoomed onto this planet, translate camera along with the planet!
    if (state.lockedPlanetId === body.id) {
      const delta = item.mesh.position.clone().sub(oldPos);
      camera.position.add(delta);
      controls.target.copy(item.mesh.position);
    }

    if (body.id === 'sun' || !visibleBody) {
      item.vArrow.visible = false;
      item.aArrow.visible = false;
    } else {
      item.vArrow.visible = showVel;
      item.aArrow.visible = showAcc;
      item.vArrow.position.set(pos.x, pos.y, pos.z);
      item.vArrow.setDirection(new THREE.Vector3(pos.vx, pos.vy, pos.vz).normalize());
      item.aArrow.position.set(pos.x, pos.y, pos.z);
      item.aArrow.setDirection(new THREE.Vector3(-pos.x, -pos.y, -pos.z).normalize());
    }
  });
}

// Smoothly Zoom Camera to Individual Planet Close-Up
function zoomToPlanetById(id) {
  state.selectedBodyId = id;
  state.lockedPlanetId = id;
  const item = planetMeshMap[id];
  if (!item) return;

  const p = item.mesh.position;
  const rad = getScenePlanetRadius(item.body);
  const camDist = Math.max(2.2, rad * 4.2);

  controls.target.copy(p);
  camera.position.set(p.x + camDist, p.y + camDist * 0.55, p.z + camDist);
  controls.update();

  document.getElementById('scale-alert-pill').textContent =
    `🔍 Locked & Zoomed on ${item.body.name}! Drag mouse to orbit 360° around ${item.body.name}, or click "Solar Overview" to zoom out.`;
  buildLeftPanel();
}

function zoomToSelectedPlanet() {
  zoomToPlanetById(state.selectedBodyId);
}

/* ============================================================================
   6. MODULE 2: NEWTONIAN GRAVITY & FIELD LAB
   ============================================================================ */
function rebuildNewtonianLab() {
  clearGroup(newtonGroup);

  const rScene = state.newtSeparationAU * 10.0;
  const p1 = new THREE.Vector3(-rScene / 2, 0, 0);
  const p2 = new THREE.Vector3(rScene / 2, 0, 0);

  const m1Mesh = new THREE.Mesh(new THREE.SphereGeometry(1.3, 32, 24), new THREE.MeshBasicMaterial({ map: generatePlanetTexture('sun') }));
  m1Mesh.position.copy(p1);
  const m2Mesh = new THREE.Mesh(new THREE.SphereGeometry(0.75, 28, 24), new THREE.MeshPhongMaterial({ map: generatePlanetTexture('earth') }));
  m2Mesh.position.copy(p2);
  newtonGroup.add(m1Mesh, m2Mesh);

  const joinGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  newtonGroup.add(new THREE.Line(joinGeo, new THREE.LineDashedMaterial({ color: 0x64748b, dashSize: 0.4, gapSize: 0.2 })));

  const fScale = Math.min(4.0, Math.max(0.9, (state.newtBody1MassSolar * state.newtBody2MassEarth) / (state.newtSeparationAU * state.newtSeparationAU) * 1.6));
  newtonGroup.add(new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), p1, fScale, 0x10b981, 0.45, 0.25));
  newtonGroup.add(new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), p2, fScale, 0x10b981, 0.45, 0.25));

  const lbl1 = makeTextSprite('F₁₂ (+)', '#10b981', 0.85);
  lbl1.position.set(p1.x + fScale / 2, 1.6, 0);
  const lbl2 = makeTextSprite('F₂₁ = −F₁₂', '#10b981', 0.85);
  lbl2.position.set(p2.x - fScale / 2, 1.6, 0);
  newtonGroup.add(lbl1, lbl2);

  const m2Ratio = state.fieldConfig === 'binary' ? state.newtBody1MassSolar : (state.fieldConfig === 'single' ? 0 : state.newtBody2MassEarth * 0.25);
  for (let x = -15; x <= 15; x += 3) {
    for (let z = -15; z <= 15; z += 3) {
      const pt = new THREE.Vector3(x, 0, z);
      const d1 = pt.distanceTo(p1), d2 = pt.distanceTo(p2);
      if (d1 < 2.0 || (m2Ratio > 0 && d2 < 1.6)) continue;

      const gVec = p1.clone().sub(pt).multiplyScalar(state.newtBody1MassSolar / Math.pow(d1, 3));
      if (m2Ratio > 0) {
        gVec.add(p2.clone().sub(pt).multiplyScalar(m2Ratio / Math.pow(d2, 3)));
      }
      const gMag = gVec.length();
      const col = new THREE.Color().setHSL(Math.max(0, 0.58 - gMag * 4), 0.9, state.dayMode ? 0.4 : 0.55);
      newtonGroup.add(new THREE.ArrowHelper(gVec.normalize(), pt, Math.min(1.8, 0.5 + gMag * 8), col.getHex(), 0.28, 0.16));
    }
  }

  if (state.showPotentialSurface) {
    const N = 50, L = 16;
    const verts = [], inds = [];
    for (let i = 0; i <= N; i++) {
      const x = -L + (2 * L * i) / N;
      for (let j = 0; j <= N; j++) {
        const z = -L + (2 * L * j) / N;
        const r1 = Math.max(1.3, Math.hypot(x - p1.x, z - p1.z));
        const r2 = Math.max(1.3, Math.hypot(x - p2.x, z - p2.z));
        const phi = -4.0 * (state.newtBody1MassSolar / r1 + (m2Ratio > 0 ? m2Ratio / r2 : 0));
        verts.push(x, phi - 1.4, z);
      }
    }
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        const a = i * (N + 1) + j, b = (i + 1) * (N + 1) + j, c = (i + 1) * (N + 1) + (j + 1), d = i * (N + 1) + (j + 1);
        inds.push(a, b, d, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setIndex(inds);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    newtonGroup.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: state.dayMode ? 0x0284c7 : 0x38bdf8, wireframe: true, transparent: true, opacity: 0.4 })));
  }
}

/* ============================================================================
   7. MODULE 3: ORBITAL MECHANICS & KEPLER LAB
   ============================================================================ */
function resetOrbitalLaunch(keepParams = false) {
  if (!keepParams) {
    state.orbR0_AU = 1.5;
    state.orbVr_kms = 0;
    state.orbVt_kms = 24.28;
  }
  state.orbParticle = {
    x: state.orbR0_AU,
    z: 0,
    vx: state.orbVr_kms / 29.78,
    vz: state.orbVt_kms / 29.78,
    trail: [],
    sectors: [],
    currentSector: [],
    sweepTimer: 0
  };
  state.graphHistory = [];
}

function setCircularOrbitSpeed() {
  const vc = 29.78 * Math.sqrt(state.orbCentralMassSolar / state.orbR0_AU);
  state.orbVr_kms = 0;
  state.orbVt_kms = parseFloat(vc.toFixed(2));
  resetOrbitalLaunch(true);
  buildRightPanel();
}

function updateOrbitalLabFrame(dt) {
  clearGroup(orbitalGroup);
  const scale = 10.0;

  const sun = new THREE.Mesh(new THREE.SphereGeometry(1.4, 32, 24), new THREE.MeshBasicMaterial({ map: generatePlanetTexture('sun') }));
  orbitalGroup.add(sun);

  const p = state.orbParticle;
  const mu = state.orbCentralMassSolar;

  if (state.running) {
    const subSteps = 8;
    const h = (dt * 0.65) / subSteps;
    for (let s = 0; s < subSteps; s++) {
      const r = Math.hypot(p.x, p.z);
      if (r > 0.16 && r < 28) {
        const ax = (-mu * p.x) / Math.pow(r, 3);
        const az = (-mu * p.z) / Math.pow(r, 3);
        p.x += p.vx * h + 0.5 * ax * h * h;
        p.z += p.vz * h + 0.5 * az * h * h;
        const rNew = Math.hypot(p.x, p.z);
        const axNew = (-mu * p.x) / Math.pow(rNew, 3);
        const azNew = (-mu * p.z) / Math.pow(rNew, 3);
        p.vx += 0.5 * (ax + axNew) * h;
        p.vz += 0.5 * (az + azNew) * h;
      }
    }
    p.trail.push(new THREE.Vector3(p.x * scale, 0, p.z * scale));
    if (p.trail.length > 500) p.trail.shift();

    if (state.keplerSweepActive) {
      p.sweepTimer += dt;
      p.currentSector.push(new THREE.Vector3(p.x * scale, 0.02, p.z * scale));
      if (p.sweepTimer > 0.65) {
        if (p.currentSector.length > 2) {
          p.sectors.push([...p.currentSector]);
          if (p.sectors.length > 6) p.sectors.shift();
        }
        p.currentSector = [new THREE.Vector3(p.x * scale, 0.02, p.z * scale)];
        p.sweepTimer = 0;
      }
    }
  }

  if (p.trail.length > 1) {
    orbitalGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p.trail), new THREE.LineBasicMaterial({ color: state.dayMode ? 0x0284c7 : 0x00d2ff })));
  }

  if (state.keplerSweepActive) {
    p.sectors.forEach((sec, idx) => {
      if (sec.length < 2) return;
      const verts = [];
      for (let i = 0; i < sec.length - 1; i++) {
        verts.push(0, 0.02, 0, sec[i].x, 0.02, sec[i].z, sec[i + 1].x, 0.02, sec[i + 1].z);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      const col = idx % 2 === 0 ? 0x0284c7 : 0x7c3aed;
      orbitalGroup.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: 0.32 })));
    });
  }

  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 24), new THREE.MeshPhongMaterial({ map: generatePlanetTexture('earth') }));
  mesh.position.set(p.x * scale, 0, p.z * scale);
  orbitalGroup.add(mesh);

  const vDir = new THREE.Vector3(p.vx, 0, p.vz).normalize();
  orbitalGroup.add(new THREE.ArrowHelper(vDir, mesh.position, 2.6, 0x10b981, 0.4, 0.22));
  const gDir = new THREE.Vector3(-p.x, 0, -p.z).normalize();
  orbitalGroup.add(new THREE.ArrowHelper(gDir, mesh.position, 2.0, 0xf43f5e, 0.4, 0.22));
}

/* ============================================================================
   8. MODULE 4, 5, 6: SPACETIME CURVATURE, GEODESICS & HIGH-CONTRAST BLACK HOLE
   ============================================================================ */
function makeHighContrastBlackHole(radius) {
  const grp = new THREE.Group();
  // Pure pitch-black Event Horizon sphere
  const eh = new THREE.Mesh(new THREE.SphereGeometry(radius, 36, 28), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  grp.add(eh);
  // Glowing relativistic Einstein/photon boundary halo so the Black Hole is 100% visible in both Dark and Day modes!
  const rim = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 1.07, 36, 28),
    new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.55, side: THREE.BackSide })
  );
  grp.add(rim);
  return grp;
}

function rebuildSpacetimeExplorer() {
  clearGroup(spacetimeGroup);
  const rsScene = Math.max(0.8, state.stMassSolar * 0.15);

  if (state.stMode === 'flamm') {
    spacetimeGroup.add(makeHighContrastBlackHole(rsScene));
  } else {
    const sun = new THREE.Mesh(new THREE.SphereGeometry(rsScene, 32, 24), new THREE.MeshBasicMaterial({ map: generatePlanetTexture('sun') }));
    spacetimeGroup.add(sun);
  }

  const gridCol = state.dayMode ? 0x0284c7 : 0x00d2ff;

  if (state.stMode === 'spatial3d') {
    const pts = [];
    const L = 14, step = 3.5;
    for (let x = -L; x <= L; x += step) {
      for (let y = -L; y <= L; y += step) {
        for (let z = -L; z <= L; z += step) {
          const pull = pos => {
            const r = Math.max(rsScene * 1.15, pos.length());
            const shift = (rsScene * 1.6) / (r * r);
            return pos.clone().multiplyScalar(1 - shift);
          };
          const p0 = pull(new THREE.Vector3(x, y, z));
          if (x + step <= L) pts.push(p0, pull(new THREE.Vector3(x + step, y, z)));
          if (y + step <= L) pts.push(p0, pull(new THREE.Vector3(x, y + step, z)));
          if (z + step <= L) pts.push(p0, pull(new THREE.Vector3(x, y, z + step)));
        }
      }
    }
    spacetimeGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: gridCol, transparent: true, opacity: 0.55 })));
  } else {
    const N = 64, L = 18;
    const verts = [], inds = [];
    for (let i = 0; i <= N; i++) {
      const x = -L + (2 * L * i) / N;
      for (let j = 0; j <= N; j++) {
        const z = -L + (2 * L * j) / N;
        const r = Math.hypot(x, z);
        let yHeight = 0;
        if (state.stMode === 'flamm') {
          const rClamped = Math.max(rsScene, r);
          yHeight = -4.5 + 2.2 * Math.sqrt(rsScene * (rClamped - rsScene));
        } else if (state.stMode === 'rubber_sheet') {
          yHeight = (-rsScene * 5.0) / Math.sqrt(r * r + 1.5);
        }
        verts.push(x, yHeight, z);
      }
    }
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        const a = i * (N + 1) + j, b = (i + 1) * (N + 1) + j, c = (i + 1) * (N + 1) + (j + 1), d = i * (N + 1) + (j + 1);
        inds.push(a, b, d, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setIndex(inds);
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    const col = state.stMode === 'rubber_sheet' ? 0xd97706 : gridCol;
    spacetimeGroup.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: col, wireframe: true, transparent: true, opacity: 0.65 })));
  }
}

function resetGRGeodesic() {
  const r0 = state.grR0_rs;
  const hc = r0 > 1.55 ? (r0 / Math.sqrt(2 * r0 - 3)) : 2.5;
  const h = hc * state.grVphiFactor;
  const E = Math.sqrt((1 - 1 / r0) * (1 + (h * h) / (r0 * r0)));
  state.grGeodesic = { r: r0, phi: 0, vr: 0, h, E, tau: 0, t_coord: 0, trail: [] };
  state.graphHistory = [];
}

function updateGRAndBlackHoleFrame(dt) {
  const isBH = state.module === 'blackhole';
  const targetGroup = isBH ? bhGroup : grGroup;
  clearGroup(targetGroup);

  const rsVis = 2.4;
  targetGroup.add(makeHighContrastBlackHole(rsVis));

  const psRing = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(makeCirclePoints(1.5 * rsVis, 80)),
    new THREE.LineBasicMaterial({ color: 0xf59e0b })
  );
  targetGroup.add(psRing);
  const psLbl = makeTextSprite('Photon Sphere (1.5 rₛ)', '#f59e0b', 0.85);
  psLbl.position.set(1.5 * rsVis, 0.7, 0);
  targetGroup.add(psLbl);

  const iscoRing = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(makeCirclePoints(3.0 * rsVis, 90)),
    new THREE.LineBasicMaterial({ color: 0x10b981 })
  );
  targetGroup.add(iscoRing);
  const iscoLbl = makeTextSprite('ISCO (3.0 rₛ = 6GM/c²)', '#10b981', 0.85);
  iscoLbl.position.set(-3.0 * rsVis, 0.7, 0);
  targetGroup.add(iscoLbl);

  if (isBH && state.bhShowAccretion) {
    const diskGeo = new THREE.RingGeometry(3.0 * rsVis, 8.0 * rsVis, 64);
    diskGeo.rotateX(Math.PI / 2);
    const diskMat = new THREE.MeshBasicMaterial({ color: 0xf97316, side: THREE.DoubleSide, transparent: true, opacity: 0.48 });
    targetGroup.add(new THREE.Mesh(diskGeo, diskMat));
  }

  const g = state.grGeodesic;
  if (state.running && g.r > 1.02 && g.r < 28) {
    const hStep = dt * 1.2;
    const isNull = state.grParticleType === 'null';
    const accel = r => isNull
      ? (g.h * g.h) / Math.pow(r, 3) - (1.5 * g.h * g.h) / Math.pow(r, 4)
      : -0.5 / (r * r) + (g.h * g.h) / Math.pow(r, 3) - (1.5 * g.h * g.h) / Math.pow(r, 4);

    const a1 = accel(g.r);
    g.r += g.vr * hStep + 0.5 * a1 * hStep * hStep;
    const a2 = accel(Math.max(1.01, g.r));
    g.vr += 0.5 * (a1 + a2) * hStep;
    g.phi += (g.h / (g.r * g.r)) * hStep;
    g.tau += hStep;
    g.t_coord += (g.E / Math.max(0.05, 1 - 1 / g.r)) * hStep;

    const px = g.r * rsVis * Math.cos(g.phi);
    const pz = g.r * rsVis * Math.sin(g.phi);
    g.trail.push(new THREE.Vector3(px, 0, pz));
    if (g.trail.length > 550) g.trail.shift();
  }

  if (g.trail.length > 1) {
    targetGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(g.trail), new THREE.LineBasicMaterial({ color: state.dayMode ? 0x0284c7 : 0x00d2ff })));
    const lastPt = g.trail[g.trail.length - 1];
    const probe = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), new THREE.MeshBasicMaterial({ color: state.dayMode ? 0x0f172a : 0xffffff }));
    probe.position.copy(lastPt);
    targetGroup.add(probe);
  }
}

function makeCirclePoints(rad, segs) {
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const a = (2 * Math.PI * i) / segs;
    pts.push(new THREE.Vector3(rad * Math.cos(a), 0, rad * Math.sin(a)));
  }
  return pts;
}

/* ============================================================================
   9. MODULE 7, 8, 9, 10: LENSING, TIME DILATION, PRECESSION & N-BODY
   ============================================================================ */
function rebuildLensingLab() {
  clearGroup(lensingGroup);
  lensingGroup.add(makeHighContrastBlackHole(1.3));

  const srcZ = state.lensSourceOffset * 4.5;
  const srcPos = new THREE.Vector3(-16, 0, srcZ);
  const obsPos = new THREE.Vector3(16, 0, 0);

  const starMesh = new THREE.Mesh(new THREE.SphereGeometry(0.65, 24, 24), new THREE.MeshBasicMaterial({ map: generatePlanetTexture('sun') }));
  starMesh.position.copy(srcPos);
  lensingGroup.add(starMesh);
  const starLbl = makeTextSprite('True Background Star', '#d97706', 0.85);
  starLbl.position.set(srcPos.x, 1.5, srcPos.z);
  lensingGroup.add(starLbl);

  const obsMesh = new THREE.Mesh(new THREE.SphereGeometry(0.55, 20, 20), new THREE.MeshPhongMaterial({ map: generatePlanetTexture('earth') }));
  obsMesh.position.copy(obsPos);
  lensingGroup.add(obsMesh);
  const obsLbl = makeTextSprite('Observer (Earth)', '#0284c7', 0.85);
  obsLbl.position.set(obsPos.x, 1.5, 0);
  lensingGroup.add(obsLbl);

  const b = state.lensImpactB_rs;
  [1, -1].forEach(sign => {
    const midPt = new THREE.Vector3(0, 0, sign * b * 1.15 + srcZ * 0.25);
    const curve = new THREE.QuadraticBezierCurve3(srcPos, midPt, obsPos);
    const pts = curve.getPoints(50);
    lensingGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: state.dayMode ? 0x0284c7 : 0x00d2ff })));

    const tangentAtObs = obsPos.clone().sub(midPt).normalize();
    const appPos = obsPos.clone().sub(tangentAtObs.multiplyScalar(32));
    lensingGroup.add(makeDashedLine3D(obsPos, appPos, 0x9333ea));

    const appStar = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), new THREE.MeshBasicMaterial({ color: 0x9333ea }));
    appStar.position.copy(appPos);
    lensingGroup.add(appStar);
    const appLbl = makeTextSprite('Apparent Lensed Image', '#9333ea', 0.8);
    appLbl.position.set(appPos.x, 1.3, appPos.z);
    lensingGroup.add(appLbl);
  });

  if (Math.abs(state.lensSourceOffset) < 0.08) {
    const einsteinRing = new THREE.Mesh(
      new THREE.RingGeometry(b * 1.05, b * 1.25, 64),
      new THREE.MeshBasicMaterial({ color: state.dayMode ? 0x0284c7 : 0x00d2ff, side: THREE.DoubleSide })
    );
    einsteinRing.rotation.y = Math.PI / 2;
    lensingGroup.add(einsteinRing);
    const erLbl = makeTextSprite('★ EINSTEIN RING (Collinear Alignment) ★', '#0284c7', 1.0);
    erLbl.position.set(0, b * 1.5, 0);
    lensingGroup.add(erLbl);
  }

  if (state.lensShowFlatRay) {
    lensingGroup.add(makeDashedLine3D(srcPos, obsPos, 0x64748b));
  }
}

function makeDashedLine3D(p1, p2, colHex) {
  const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  const line = new THREE.Line(geo, new THREE.LineDashedMaterial({ color: colHex, dashSize: 0.5, gapSize: 0.3 }));
  line.computeLineDistances();
  return line;
}

function updateTimeDilationFrame(dt) {
  clearGroup(tdGroup);
  if (state.running) state.tdCoordTime += dt * 10;

  const rsVis = 2.2;
  tdGroup.add(makeHighContrastBlackHole(rsVis));

  const factorA = Math.sqrt(Math.max(0.01, 1 - 1 / state.tdClockAR_rs));
  const factorB = Math.sqrt(Math.max(0.01, 1 - 1 / state.tdClockBR_rs));
  const tauA = state.tdCoordTime * factorA;
  const tauB = state.tdCoordTime * factorB;

  const drawClock3D = (r_rs, tau, colHex, nameStr) => {
    const xPos = r_rs * rsVis;
    const face = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 0.18, 32), new THREE.MeshBasicMaterial({ color: state.dayMode ? 0x1e293b : 0x0f172a }));
    face.rotation.x = Math.PI / 2;
    face.position.set(xPos, 0, 0);
    tdGroup.add(face);

    const handAng = -(tau % 60) * (2 * Math.PI / 60);
    const handDir = new THREE.Vector3(Math.sin(handAng), Math.cos(handAng), 0);
    tdGroup.add(new THREE.ArrowHelper(handDir, new THREE.Vector3(xPos, 0, 0.16), 1.0, colHex, 0.3, 0.2));

    const lbl = makeTextSprite(`${nameStr}: τ = ${tau.toFixed(1)} s`, '#' + colHex.toString(16).padStart(6, '0'), 0.9);
    lbl.position.set(xPos, 1.9, 0);
    tdGroup.add(lbl);
  };

function rebuildCompareNewtonGR() {
  clearGroup(compareGroup);

  const sun = new THREE.Mesh(new THREE.SphereGeometry(1.4, 32, 24), new THREE.MeshBasicMaterial({ map: generatePlanetTexture('sun') }));
  compareGroup.add(sun);

  const a = state.compSemiMajor_rs;
  const e = state.compEccentricity;
  const p = a * (1 - e * e);
  const deltaPhiPerOrbit = (3 * Math.PI) / p;

  const newtPts = [], grPts = [];
  const totalPhi = 6 * Math.PI;
  const steps = 450;
  for (let i = 0; i <= steps; i++) {
    const phi = (totalPhi * i) / steps;
    const rNewt = p / (1 + e * Math.cos(phi));
    newtPts.push(new THREE.Vector3(rNewt * Math.cos(phi), 0, rNewt * Math.sin(phi)));

    const k = 1 - deltaPhiPerOrbit / (2 * Math.PI);
    const rGR = p / (1 + e * Math.cos(k * phi));
    grPts.push(new THREE.Vector3(rGR * Math.cos(phi), 0.05, rGR * Math.sin(phi)));
  }

  compareGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(newtPts), new THREE.LineBasicMaterial({ color: 0x10b981 })));
  compareGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(grPts), new THREE.LineBasicMaterial({ color: 0xf43f5e })));

  const l1 = makeTextSprite('Newtonian (Closed Ellipse, Δφ = 0)', '#10b981', 0.9);
  l1.position.set(-a, 2.0, -a);
  const l2 = makeTextSprite(`General Relativity (Precessing Rosette, Δφ = ${(deltaPhiPerOrbit * 180 / Math.PI).toFixed(1)}°/orbit)`, '#f43f5e', 0.95);
  l2.position.set(a, 2.0, a);
  compareGroup.add(l1, l2);
}

function updateNBodyFrame(dt) {
  clearGroup(nbodyGroup);
  const bodies = state.nBodies;
  if (state.running) {
    const h = dt * 1.4;
    const G_sim = 8.0;
    const acc = bodies.map(() => ({ ax: 0, az: 0 }));
    for (let i = 0; i < bodies.length; i++) {
      for (let j = 0; j < bodies.length; j++) {
        if (i === j) continue;
        const dx = bodies[j].x - bodies[i].x;
        const dz = bodies[j].z - bodies[i].z;
        const distSq = dx * dx + dz * dz + 0.35;
        const f = (G_sim * bodies[j].m) / Math.pow(distSq, 1.5);
        acc[i].ax += f * dx;
        acc[i].az += f * dz;
      }
    }
    bodies.forEach((b, i) => {
      b.vx += acc[i].ax * h;
      b.vz += acc[i].az * h;
      b.x += b.vx * h;
      b.z += b.vz * h;
      b.trail.push(new THREE.Vector3(b.x, 0, b.z));
      if (b.trail.length > 260) b.trail.shift();
    });
  }

  bodies.forEach(b => {
    const r = Math.max(0.45, Math.pow(b.m, 0.3) * 1.0);
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 24), new THREE.MeshPhongMaterial({ map: generatePlanetTexture(b.tex || 'earth') }));
    m.position.set(b.x, 0, b.z);
    nbodyGroup.add(m);
    if (b.trail.length > 1) {
      nbodyGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(b.trail), new THREE.LineBasicMaterial({ color: 0x0284c7 })));
    }
  });
}

          <input type="range" min="0.1" max="0.75" step="0.05" value="${state.compEccentricity}" oninput="state.compEccentricity=parseFloat(this.value); rebuildCompareNewtonGR(); buildRightPanel()">
        </div>
        <div class="formula-box">
          GR Perihelion Advance per Orbit:<br>
          Δφ ≈ 6πGM / [a(1 − e²)c²] = ${dPhiDeg.toFixed(2)}° / orbit
        </div>
      </div>
    `;
  } else if (mod === 'experiments') {
    el.innerHTML = `
      <div class="panel-sec">
        <div class="sec-title"><span>N-Body Sandbox, 10 Lessons &amp; 6 Challenges</span></div>
        <div style="display:flex; gap:4px; margin-bottom:8px;">
          <button class="btn-sm ${state.expSubTab==='nbody'?'active-toggle':''}" style="flex:1;" onclick="state.expSubTab='nbody'; buildRightPanel()">N-Body Lab</button>
          <button class="btn-sm ${state.expSubTab==='guided'?'active-toggle':''}" style="flex:1;" onclick="state.expSubTab='guided'; buildRightPanel()">10 Lessons</button>
          <button class="btn-sm ${state.expSubTab==='quiz'?'active-toggle':''}" style="flex:1;" onclick="state.expSubTab='quiz'; buildRightPanel()">Challenges</button>
        </div>
        ${renderExperimentsTabHTML()}
      </div>
    `;
  }
}

const LESSONS = [
  { t: '1. Why Do Planets Orbit the Sun?', b: 'A planet has tangential inertia while the Sun pulls it inward with gravity F = GMm/r², continually curving its path into a closed conic section.' },
  { t: '2. Why Does a Planet Speed Up Near Perihelion?', b: 'Conservation of angular momentum h = |r × v| requires orbital speed v to increase when radial distance r decreases (Kepler\'s 2nd Law).' },
  { t: '3. Inverse-Square Law of Gravity', b: 'Doubling the separation distance r reduces gravitational attraction by a factor of 2² = 4.' },
  { t: '4. Orbital Escape Velocity', b: 'When kinetic energy v²/2 equals gravitational potential magnitude GM/r (total specific energy ε = 0), the body escapes on a parabolic trajectory at v_esc = √(2GM/r).' },
  { t: '5. How Mass Affects Spacetime', b: 'In General Relativity, mass-energy curves 4-dimensional spacetime geometry; free-falling bodies follow spacetime geodesics.' },
  { t: '6. Spatial Curvature vs. Spacetime Curvature', b: 'Planetary orbits are governed primarily by the time-component of the metric (g_tt = −(1 − r_s/r)), not merely 3D spatial bending.' },
  { t: '7. Gravitational Time Dilation', b: 'A stationary clock deeper in a gravitational potential well ticks slower relative to a distant clock: dτ = dt √(1 − r_s/r).' },
  { t: '8. How Gravity Deflects Massless Light', b: 'Photons follow null geodesics (ds² = 0) through curved spacetime, bending by α ≈ 4GM/(bc²) near a mass M.' },
  { t: '9. Event Horizon vs. Photon Sphere vs. ISCO', b: 'For a Schwarzschild black hole: Event Horizon is at r_s = 2GM/c², unstable light orbits at 1.5 r_s, and innermost stable matter orbits at 3.0 r_s.' },
  { t: '10. When Is General Relativity Necessary?', b: 'Whenever r approaches r_s (compact objects) or high precision is required (GPS satellite clocks, Mercury\'s perihelion advance).' }
];

const QUIZZES = [
  { q: '1. If the distance between two stars doubles while their masses stay constant, the gravitational force becomes:', o: ['Half (1/2)', 'One-Quarter (1/4)', 'Double (2×)', 'Unchanged'], a: 1, e: 'By F = Gm₁m₂/r², doubling r divides F by 2² = 4.' },
  { q: '2. What is the ratio of escape speed v_esc to circular orbital speed v_c at the same radius r?', o: ['1.0', '√2 ≈ 1.414', '2.0', '0.5'], a: 1, e: 'v_c = √(GM/r) and v_esc = √(2GM/r), so v_esc / v_c = √2.' },
  { q: '3. If a test particle has positive specific mechanical energy (ε = v²/2 − GM/r > 0), its trajectory is:', o: ['A circle', 'A bound ellipse', 'An unbound hyperbola', 'A spiral into the star'], a: 2, e: 'ε > 0 corresponds to an unbound hyperbolic flyby with eccentricity e > 1.' },
  { q: '4. At what radius does the Photon Sphere of a non-rotating Schwarzschild black hole lie?', o: ['r = r_s', 'r = 1.5 r_s = 3GM/c²', 'r = 3.0 r_s = 6GM/c²', 'r = 0'], a: 1, e: 'Null circular geodesics occur at r = 3GM/c² = 1.5 r_s.' },
  { q: '5. Is the singularity at r = r_s in Schwarzschild coordinates a physical divergence of spacetime curvature?', o: ['Yes, curvature is infinite at r = r_s', 'No, it is a coordinate singularity; the Kretschmann scalar K = 48G²M²/(c⁴r⁶) is finite at r = r_s', 'Only for planets', 'It is a solid wall'], a: 1, e: 'r = r_s is a coordinate singularity; physical curvature diverges at the central singularity r = 0.' },
  { q: '6. Does a rubber sheet stretched by a heavy ball in Earth\'s gravity literally represent 4D spacetime curvature?', o: ['Yes, it is exact', 'No, it is only a visual analogy and cannot directly represent gravitational time dilation (g_tt)', 'It only works for black holes', 'It proves spacetime is 2D'], a: 1, e: 'The rubber sheet relies on external gravity and misses the crucial time-dilation component of the metric.' }
];

function renderExperimentsTabHTML() {
  if (state.expSubTab === 'nbody') {
    return `
      <p style="font-size:11.5px; color:var(--text-muted); margin-bottom:8px;">
        Newtonian N-Body Velocity-Verlet Integrator.
      </p>
      <button class="btn-sm" style="width:100%; margin-bottom:6px;" onclick="addRandomNBody()">+ Add New Orbiting Planet</button>
      <button class="btn-sm" style="width:100%; margin-bottom:6px;" onclick="initDefaultNBody()">↺ Reset 3-Body System</button>
    `;
  } else if (state.expSubTab === 'guided') {
    const l = LESSONS[state.guidedIdx];
    return `
      <div class="info-card">
        <h4>${l.t}</h4>
        <p>${l.b}</p>
      </div>
      <div style="display:flex; justify-content:space-between;">
        <button class="btn-sm" onclick="state.guidedIdx=(state.guidedIdx+LESSONS.length-1)%LESSONS.length; buildRightPanel()">◀ Prev</button>
        <button class="btn-sm" onclick="state.guidedIdx=(state.guidedIdx+1)%LESSONS.length; buildRightPanel()">Next ▶</button>
      </div>
    `;
  } else {
    const q = QUIZZES[state.quizIdx];
    return `
      <div class="info-card">
        <p style="font-weight:700; margin-bottom:6px;">${q.q}</p>
        ${q.o.map((opt, i) => `
          <button class="btn-sm" style="width:100%; text-align:left; margin-bottom:4px;" onclick="alert('${i === q.a ? '✓ Correct! ' : '✗ Incorrect. '}' + '${q.e.replace(/'/g, "\\'")}')">${opt}</button>
        `).join('')}
      </div>
      <button class="btn-sm" style="width:100%;" onclick="state.quizIdx=(state.quizIdx+1)%QUIZZES.length; buildRightPanel()">Next Challenge ▶</button>
    `;
  }
}

function addRandomNBody() {
  const r = 5 + Math.random() * 6;
  const ang = Math.random() * 2 * Math.PI;
  const v = Math.sqrt(8.0 / r);
  state.nBodies.push({
    name: `Body ${state.nBodies.length + 1}`,
    m: 0.05,
    x: r * Math.cos(ang),
    z: r * Math.sin(ang),
    vx: -v * Math.sin(ang),
    vz: v * Math.cos(ang),
    tex: 'mars',
    trail: []
  });
}

/* ============================================================================
   11. BOTTOM TELEMETRY & LIVE GRAPH ENGINE
   ============================================================================ */
function updateBottomTelemetryAndGraph() {
  const leftBox = document.getElementById('bottom-left-telemetry');
  const rightBox = document.getElementById('bottom-right-model-info');
  const mod = state.module;

  if (mod === 'solar') {
    const item = planetMeshMap[state.selectedBodyId] || planetMeshMap['earth'];
    const st = item.currentState || { r_AU: 1, speed_kms: 29.8 };
    state.graphHistory.push({ v1: st.r_AU, v2: st.speed_kms / 20 });
    leftBox.innerHTML = `
      <div style="color:var(--accent); font-weight:700;">SOLAR TELEMETRY (${item.body.name})</div>
      <div class="tel-row"><span>Elapsed Time:</span><span class="v">${state.simTimeDays.toFixed(1)} days</span></div>
      <div class="tel-row"><span>Heliocentric r:</span><span class="v">${st.r_AU.toFixed(4)} AU</span></div>
      <div class="tel-row"><span>Instantaneous v:</span><span class="v">${st.speed_kms.toFixed(2)} km/s</span></div>
      <div class="tel-row"><span>Camera Lock:</span><span class="v">${state.lockedPlanetId ? item.body.name : 'Free Overview'}</span></div>
    `;
    rightBox.innerHTML = `
      <div style="color:var(--newt-col); font-weight:700;">MODEL ASSUMPTIONS &amp; UNITS</div>
      <div style="font-size:10.5px; color:var(--text-muted); line-height:1.4;">
        <strong>Model:</strong> Two-body Keplerian equation solver ($M = E - e\sin E$) with procedural planetary surface &amp; atmospheric textures.
      </div>
    `;
  } else if (mod === 'orbital') {
    const p = state.orbParticle;
    const r = Math.hypot(p.x, p.z);
    const vSq = p.vx * p.vx + p.vz * p.vz;
    const eps = 0.5 * vSq - state.orbCentralMassSolar / r;
    const h = Math.abs(p.x * p.vz - p.z * p.vx);
    state.graphHistory.push({ v1: r, v2: Math.sqrt(vSq) });
    leftBox.innerHTML = `
      <div style="color:var(--accent); font-weight:700;">ORBITAL MECHANICS TELEMETRY</div>
      <div class="tel-row"><span>Radius r:</span><span class="v">${r.toFixed(3)} AU</span></div>
      <div class="tel-row"><span>Speed v:</span><span class="v">${(Math.sqrt(vSq)*29.78).toFixed(2)} km/s</span></div>
      <div class="tel-row"><span>Specific Energy ε:</span><span class="v">${eps.toFixed(3)} (${eps < -0.01 ? 'Bound' : (eps > 0.01 ? 'Unbound' : 'Parabolic')})</span></div>
      <div class="tel-row"><span>Ang. Momentum h:</span><span class="v">${h.toFixed(3)} AU²/yr</span></div>
    `;
    rightBox.innerHTML = `
      <div style="color:var(--newt-col); font-weight:700;">MODEL VALIDATION</div>
      <div style="font-size:10.5px; color:var(--text-muted); line-height:1.4;">
        <strong>Integrator:</strong> Symplectic Velocity-Verlet conserving specific mechanical energy $\varepsilon$ and angular momentum $h$.
      </div>
    `;
  } else {
    const g = state.grGeodesic;
    state.graphHistory.push({ v1: g.r / 4, v2: (g.t_coord - g.tau) * 0.1 });
    leftBox.innerHTML = `
      <div style="color:var(--gr-col); font-weight:700;">RELATIVISTIC TELEMETRY</div>
      <div class="tel-row"><span>Radial Coord r:</span><span class="v">${g.r.toFixed(3)} rₛ</span></div>
      <div class="tel-row"><span>Proper Time τ:</span><span class="v">${g.tau.toFixed(2)} M</span></div>
      <div class="tel-row"><span>Coord Time t:</span><span class="v">${g.t_coord.toFixed(2)} M</span></div>
      <div class="tel-row"><span>Horizon rₛ:</span><span class="v">1.000 rₛ (2GM/c²)</span></div>
    `;
    rightBox.innerHTML = `
      <div style="color:var(--gr-col); font-weight:700;">SCHWARZSCHILD METRIC MODEL</div>
      <div style="font-size:10.5px; color:var(--text-muted); line-height:1.4;">
        <strong>Assumptions:</strong> Exterior vacuum spacetime of a static, spherically symmetric, uncharged mass ($J=0, Q=0$).
      </div>
    `;
  }

  if (state.graphHistory.length > 220) state.graphHistory.shift();

  const canvas = document.getElementById('live-graph-canvas');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.fillStyle = state.dayMode ? '#f8fafc' : '#04070d';
  ctx.fillRect(0, 0, w, h);

  const drawCurve = (key, col, scaleY) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    state.graphHistory.forEach((pt, idx) => {
      const sx = (idx / 220) * w;
      const sy = h - 18 - pt[key] * scaleY;
      if (idx === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    });
    ctx.stroke();
  };
  drawCurve('v1', '#0284c7', 26);
  drawCurve('v2', '#059669', 26);
  ctx.font = 'bold 10.5px JetBrains Mono, monospace';
  ctx.fillStyle = '#0284c7'; ctx.fillText('─── Radial Distance r(t)', 10, 15);
  ctx.fillStyle = '#059669'; ctx.fillText('─── Orbital Speed / Time Shift', 195, 15);
  ctx.restore();
}

/* ============================================================================
   12. TOOLBAR, CAMERA PRESETS, CLICK-TO-ZOOM & ANIMATION LOOP
   ============================================================================ */
function setScaleMode(mode) {
  state.scaleViewMode = mode;
  initSolarSystem3D();
  buildRightPanel();
}

function syncLayers() {
  updateSolarSystemFrame(0);
}

function togglePlay() {
  state.running = !state.running;
  const btn = document.getElementById('btn-play');
  btn.textContent = state.running ? '⏸ Pause' : '▶ Play';
  btn.classList.toggle('active-toggle', state.running);
}

function stepSimulation(dir) {
  state.running = false;
  document.getElementById('btn-play').textContent = '▶ Play';
  document.getElementById('btn-play').classList.remove('active-toggle');
  state.simTimeDays += dir * 5;
  updateSolarSystemFrame(0);
}

function setCameraPreset(preset) {
  state.lockedPlanetId = null;
  if (preset === 'overview') {
    controls.target.set(0, 0, 0);
    camera.position.set(0, 42, 72);
    document.getElementById('scale-alert-pill').textContent =
      '🔍 Click any planet on the left (or in 3D) to Zoom In close-up! Click "Solar Overview" to zoom back out.';
  } else if (preset === 'ecliptic_top') {
    controls.target.set(0, 0, 0);
    camera.position.set(0, 95, 0.01);
  } else if (preset === 'edge_on') {
    controls.target.set(0, 0, 0);
    camera.position.set(0, 1.0, 80);
  }
  controls.update();
}

function toggleUnitSystem() {
  state.geometrizedUnits = !state.geometrizedUnits;
  document.getElementById('btn-unit-sys').textContent = state.geometrizedUnits
    ? 'Units: Geometrized (G = c = 1)'
    : 'Units: SI (m, kg, s)';
  buildRightPanel();
}

function exportGraphCSV() {
  const rows = ['step,radius_or_v1,speed_or_v2', ...state.graphHistory.map((p, i) => `${i},${p.v1.toFixed(5)},${p.v2.toFixed(5)}`)];
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `spacetime-lab-${state.module}-data.csv`;
  a.click();
}

function onCanvasClick(e) {
  if (state.module !== 'solar') return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects, false);
  if (hits.length > 0 && hits[0].object.userData.bodyId) {
    zoomToPlanetById(hits[0].object.userData.bodyId);
  }
}

function onWindowResize() {
  const container = document.getElementById('canvas-container');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

/* Drawer Toggles */
let lOpen = true, rOpen = true, bOpen = true;
function toggleLeftDrawer(force) {
  lOpen = typeof force === 'boolean' ? force : !lOpen;
  document.getElementById('left-drawer').classList.toggle('closed', !lOpen);
  document.getElementById('tab-left').classList.toggle('closed', !lOpen);
  document.getElementById('tab-left').textContent = lOpen ? '◀ OBJECTS' : '▶ OBJECTS';
  document.getElementById('btn-left-drawer').classList.toggle('active-toggle', lOpen);
  document.getElementById('bottom-drawer').classList.toggle('expand-left', !lOpen);
}
function toggleRightDrawer(force) {
  rOpen = typeof force === 'boolean' ? force : !rOpen;
  document.getElementById('right-drawer').classList.toggle('closed', !rOpen);
  document.getElementById('tab-right').classList.toggle('closed', !rOpen);
  document.getElementById('tab-right').textContent = rOpen ? 'PHYSICS & MATH ▶' : '◀ PHYSICS & MATH';
  document.getElementById('btn-right-drawer').classList.toggle('active-toggle', rOpen);
  document.getElementById('bottom-drawer').classList.toggle('expand-right', !rOpen);
}
function toggleBottomDrawer(force) {
  bOpen = typeof force === 'boolean' ? force : !bOpen;
  document.getElementById('bottom-drawer').classList.toggle('closed', !bOpen);
  document.getElementById('tab-bottom').classList.toggle('closed', !bOpen);
  document.getElementById('tab-bottom').textContent = bOpen ? '▼ TIMELINE & LIVE GRAPHS' : '▲ TIMELINE & LIVE GRAPHS';
  document.getElementById('btn-bottom-drawer').classList.toggle('active-toggle', bOpen);
}
function toggleCleanSpaceView() {
  const clean = !lOpen && !rOpen && !bOpen;
  toggleLeftDrawer(clean);
  toggleRightDrawer(clean);
  toggleBottomDrawer(clean);
  document.getElementById('btn-clean-view').classList.toggle('active-toggle', !clean);
}

let lastT = performance.now();
function animateLoop(now = performance.now()) {
  requestAnimationFrame(animateLoop);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (state.module === 'solar') updateSolarSystemFrame(dt);
  else if (state.module === 'orbital') updateOrbitalLabFrame(dt);
  else if (state.module === 'gr' || state.module === 'blackhole') updateGRAndBlackHoleFrame(dt);
  else if (state.module === 'timedilation') updateTimeDilationFrame(dt);
  else if (state.module === 'experiments') updateNBodyFrame(dt);

  updateBottomTelemetryAndGraph();
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('DOMContentLoaded', () => {
  initThreeJS();
  selectModule('solar');
  animateLoop();
});
</script>
